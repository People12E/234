# Builds an UNSIGNED .ipa on a GitHub-hosted Mac (no secrets needed). Download it from the run's Artifacts,
# then sign it with AltStore / Sideloadly / your own certificate. For a signed build run scripts/build_ipa.sh on a Mac.
name: Build IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 16
        # XcodeGen writes Xcode-16-format projects, which Xcode 15 cannot open.
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Environment
        run: |
          xcodebuild -version
          python3 --version
          which xcodegen || echo 'xcodegen not installed yet (the build script installs it)'
          ls -la
          ls -la scripts
          head -20 scripts/build_ipa.sh
      - name: Build unsigned IPA
        run: UNSIGNED=1 bash scripts/build_ipa.sh
      - uses: actions/upload-artifact@v5
        with:
          name: BP-unsigned-ipa
          path: build/BP-unsigned.ipa
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
